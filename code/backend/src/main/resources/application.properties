spring.application.name=fiwdee-backend

# ===================================================================
# Database / Datasource Configuration (PostgreSQL)
# ===================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fiwdee_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# JPA & Hibernate Configuration
# ===================================================================
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===================================================================
# Database Initialization Scripts (schema.sql & data.sql)
# Set to 'always' so idempotent data.sql seeds catalog and staff users automatically.
# ===================================================================
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:always}
spring.sql.init.continue-on-error=true

# ===================================================================
# Server & Logging Configuration
# ===================================================================
server.port=${SERVER_PORT:8080}
server.servlet.context-path=
logging.level.com.fiwdee=INFO
logging.level.org.springframework.web=INFO

# ===================================================================
# JWT Authentication (Dev 1)
# Secret must stay >= 32 bytes for HS256. Override via env in production.
# ===================================================================
fiwdee.jwt.secret=${FIWDEE_JWT_SECRET:fiwdee-dev-jwt-secret-key-change-me-in-production-256bit}
fiwdee.jwt.expiration-ms=${FIWDEE_JWT_EXPIRATION_MS:86400000}

# Online-session window for the Admin Users summary (minutes)
fiwdee.security.online-window-minutes=${FIWDEE_ONLINE_WINDOW_MINUTES:15}

# Idempotent demo staff accounts (Owner/Receptionist) — disable in shared environments
fiwdee.seed-admin-accounts=${FIWDEE_SEED_ADMIN_ACCOUNTS:true}

# ===================================================================
# Swagger UI / OpenAPI Configuration
# ===================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
