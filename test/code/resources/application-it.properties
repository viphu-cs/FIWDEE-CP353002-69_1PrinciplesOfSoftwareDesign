# ===================================================================
# Integration test profile (ใช้กับคลาส com.fiwdee.integration.*)
# ต้องมี PostgreSQL จาก docker compose และสร้างฐาน fiwdee_test ไว้ครั้งเดียว:
#   docker exec fiwdee-postgres createdb -U postgres fiwdee_test
# เปลี่ยน URL ได้ด้วยตัวแปร IT_DB_URL / IT_DB_USER / IT_DB_PASSWORD
# ===================================================================
spring.datasource.url=${IT_DB_URL:jdbc:postgresql://localhost:5432/fiwdee_test}
spring.datasource.username=${IT_DB_USER:postgres}
spring.datasource.password=${IT_DB_PASSWORD:postgres}

# สร้าง schema ใหม่ทุกครั้งที่เริ่ม test context และลบทิ้งเมื่อจบ
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# ให้เหลือ seeder เดียว (DataSeeder) เพื่อให้ข้อมูลตั้งต้นแน่นอนทุกครั้ง
fiwdee.seed-demo-data=false
fiwdee.seed-admin-accounts=false

logging.level.com.fiwdee=WARN
logging.level.org.hibernate.SQL=WARN
